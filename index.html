<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <title>경기지역본부 대기순번 현황판 | 점검 중</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #f4f6fa; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif; color: #172238; display: grid; place-items: center; padding: 24px; }
    .panel { width: min(100%, 540px); background: #fff; border: 1px solid #e3e8f0; border-radius: 20px; box-shadow: 0 16px 48px rgba(17, 39, 70, .07); padding: 52px 28px 48px; text-align: center; }
    .symbol { display: grid; place-items: center; width: 66px; height: 66px; margin: 0 auto 24px; border-radius: 18px; background: #eaf1ff; color: #2555a4; }
    .eyebrow { margin: 0 0 15px; font-size: 15px; font-weight: 700; color: #52647d; }
    h1 { font-size: clamp(24px, 6vw, 30px); margin: 0 0 20px; letter-spacing: -.045em; line-height: 1.4; }
    p { font-size: 16px; line-height: 1.85; color: #57667b; margin: 0; word-break: keep-all; }
    .footer { margin-top: 38px; padding-top: 22px; border-top: 1px solid #edf0f4; font-size: 14px; color: #7b8796; }
  </style>
</head>
<body>
  <main class="panel" role="status" aria-live="polite">
    <div class="symbol" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
      </svg>
    </div>
    <div class="eyebrow">경기지역본부 대기순번 현황판</div>
    <h1>현재 내부 점검 중입니다</h1>
    <p>보다 정확한 현황 제공을 위해<br>게시판을 일시적으로 점검하고 있습니다.<br>점검 완료 후 다시 이용하실 수 있습니다.</p>
    <div class="footer">한국타워크레인조종사노동조합 경기지역본부</div>
  </main>
</body>
</html>
